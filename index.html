<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizFlow — One Flow. One View. Better Decisions.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="index.css" />
</head>

<body>

  <!-- ─── Decorative background canvas ─── -->
  <div class="bg-canvas" aria-hidden="true">
    <div class="bg-orb bg-orb-top"></div>
    <div class="bg-orb bg-orb-right"></div>
    <div class="bg-orb bg-orb-bottom"></div>
    <div class="bg-grain"></div>
  </div>


  <!-- ════════════════════════════════════════════
       NAVIGATION
  ════════════════════════════════════════════ -->
  <nav class="navbar" id="navbar">

    <!-- Logo -->
    <a href="#" class="nav-logo" aria-label="BizFlow Home">
      <div class="logo-icon-wrap">
        <svg class="logo-svg" viewBox="0 0 36 36" fill="none">
          <rect x="3" y="20" width="7" height="13" rx="2.5" fill="#00897B" />
          <rect x="14" y="13" width="7" height="20" rx="2.5" fill="#00B09B" />
          <rect x="25" y="6" width="7" height="27" rx="2.5" fill="#00C4AD" />
          <polyline points="6.5,18 17.5,11 28.5,4" stroke="#00897B" stroke-width="2.2" stroke-linecap="round"
            fill="none" />
          <circle cx="28.5" cy="4" r="2.5" fill="#00C4AD" />
        </svg>
      </div>
      <span class="logo-text">
        <span class="logo-biz">Biz</span><span class="logo-flow">Flow</span>
      </span>
    </a>

    <!-- Centre links -->
    <ul class="nav-links" id="nav-links" role="list">
      <li><a href="#hero" class="nav-item active">Home</a></li>
      <li><a href="#features" class="nav-item">Features</a></li>
      <li><a href="#about" class="nav-item">About</a></li>
      <li><a href="#contact" class="nav-item">Contact</a></li>
    </ul>

    <!-- Right actions -->
    <div class="nav-actions">
      <a href="login.html" class="btn-nav-login">Login</a>
      <a href="login.html" class="btn-nav-started">Get Started</a>
    </div>

    <!-- Mobile toggle -->
    <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
  </nav>


  <!-- ════════════════════════════════════════════
       HERO SECTION
       1. BIZ FLOW wordmark
       2. hero_image1.png (centred, background-less, lower size)
       3. Tagline
  ════════════════════════════════════════════ -->
  <section class="hero" id="hero">

    <!-- 1. Wordmark ─────────────────────────── -->
    <div class="wordmark-block">
      <h1 class="wordmark">
        <span class="wm-biz">BIZ</span><span class="wm-dot"> </span><span class="wm-flow">FLOW</span>
      </h1>
    </div>

    <!-- 2. Hero Image (Clean transparent baby boss + table) ──── -->
    <div class="hero-image-frame">
      <div class="hero-image-shadow" aria-hidden="true"></div>
      <img src="hero_image1.png" alt="BizFlow Baby Boss character" class="hero-img" draggable="false" />
    </div>

    <!-- 3. Tagline ──────────────────────────── -->
    <div class="tagline-block">
      <p class="tagline">
        ONE FLOW.&emsp;ONE VIEW.&emsp;BETTER DECISIONS.
      </p>
      <!-- Decorative divider lines flanking tagline -->
      <div class="tagline-ornament" aria-hidden="true">
        <span class="ornament-line"></span>
        <span class="ornament-diamond"></span>
        <span class="ornament-line"></span>
      </div>
    </div>

  </section>


  <script src="app.js"></script>
</body>

</html>
